name: CI

on:
  push:
  pull_request:

env:
  FOUNDRY_PROFILE: default

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Allocation script tests
        working-directory: script/allocation
        run: |
          npm ci
          npm test
