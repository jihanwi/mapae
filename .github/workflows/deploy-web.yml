name: Deploy Web

on:
  push:
    branches: [main]
    # W-T48: GitHub Pages serves only a notice (pages-stub/); the testnet app is not published here.
    paths: ["pages-stub/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-stub

      - id: deployment
        uses: actions/deploy-pages@v4
